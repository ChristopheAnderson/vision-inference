name: VisionEval Non-Regression Gate (CI/CD)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  non-regression-gate:
    name: "Deterministic VisionEval-Gate (Seed=42, Max F1 Drop <= 1.0%)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Core Evaluation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyyaml

      - name: Run Module 1 — VLM Video Chain & Calibration Check
        run: |
          python -c "from src.module1_vlm_video_chain import simulate_video_chain_execution; df, summary = simulate_video_chain_execution(); assert summary['compression_ratio_pct'] > 85.0; print('Module 1 OK:', summary)"

      - name: Run Module 2 — Non-Regression Gate on 1,880 Golden Videos
        run: |
          python -c "from src.module2_eval_non_regression import run_non_regression_protocol; df, manifest = run_non_regression_protocol(max_allowed_f1_drop_pct=1.0); assert manifest['gate_decision'] == 'APPROVED_FOR_PRODUCTION', 'Non-Regression Gate Failed!'; print('Module 2 Gate PASSED! SHA256:', manifest['reproducibility_sha256'])"

      - name: Run Module 3 — GPU Capacity Reference Verification
        run: |
          python -c "from src.module3_vllm_capacity_optimizer import compute_gpu_capacity_plan; cap = compute_gpu_capacity_plan('NVIDIA L4 (24 Go VRAM)', 100000, 60, 8); assert cap['capacity_videos_per_hour_per_gpu'] > 3000; print('Module 3 Capacity OK:', cap)"
