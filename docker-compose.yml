version: "3.9"

services:
  vllm-vision-engine:
    image: vllm/vllm-openai:v0.6.2
    container_name: vllm-qwen25-vl-awq
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CUBLAS_WORKSPACE_CONFIG=:4096:8
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
    command: >
      --model Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      --quantization awq_marlin
      --dtype half
      --gpu-memory-utilization 0.90
      --max-model-len 8192
      --max-num-seqs 28
      --limit-mm-per-prompt image=8
      --enable-prefix-caching
      --seed 42
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]

  vision-hub-dashboard:
    build: .
    container_name: vision-inference-hub
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - VLLM_ENDPOINT=http://vllm-vision-engine:8000/v1
      - PRIVACY_BLUR_ENABLED=true
    depends_on:
      - vllm-vision-engine
