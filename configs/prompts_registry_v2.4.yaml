registry_metadata:
  registry_name: "sovereign-vlm-video-prompts"
  version: "2.4.0"
  updated_at: "2026-11-01"
  author: "Ing. Christophe WAVOEKE"
  target_models:
    - "Qwen/Qwen2.5-VL-7B-Instruct-AWQ"
    - "llava-hf/llava-onevision-qwen2-7b-ov-hf"
    - "OpenGVLab/InternVL2_5-8B-AWQ"
  deterministic_execution:
    seed: 42
    temperature: 0.0
    top_p: 1.0
    guided_json_schema: true
  calibration:
    method: "temperature_scaling_plus_isotonic"
    optimal_temperature_T: 1.38
    ece_before_calibration: 0.084
    ece_after_calibration: 0.019
    cross_frame_window_N: 5
    min_consensus_ratio: 0.60

categories:
  CAT_01_PERIMETER_INTRUSION:
    label_fr: "Sécurité Périmétrique & Intrusion"
    calibrated_threshold: 0.74
    system_prompt: >
      Analyse la séquence de trames vidéo extraite. Identifie toute présence humaine ou véhicule
      franchissant une zone périmétrique restreinte. Retourne exclusivement un objet JSON
      contenant: category, detected (bool), raw_logit (float), bounding_regions, temporal_consistency.
  CAT_02_TRAFFIC_ANOMALY:
    label_fr: "Anomalie de Flux Routier & Occupation Voie Publique"
    calibrated_threshold: 0.68
    system_prompt: >
      Analyse les trames successives du flux de circulation. Détecte tout arrêt anormal sur voie
      rapide, contresens ou congestion critique persistante sur au moins 3 trames consécutives.
  CAT_03_MEDIA_INTEGRITY:
    label_fr: "Intégrité Média & Détection d'Altération"
    calibrated_threshold: 0.81
    system_prompt: >
      Évalue la cohérence spatio-temporelle des trames vidéo pour détecter les artefacts de
      manipulation, coupures de flux ou contenus non conformes.
  CAT_04_PRIVACY_PII:
    label_fr: "Détection Visages & Plaques d'Immatriculation (Anonymisation PII)"
    calibrated_threshold: 0.55
    system_prompt: >
      Localise tous les visages humains et plaques minéralogiques visibles afin d'appliquer
      le floutage Gaussien irréversible avant archivage (conformité Loi N° 2017-20 / RGPD).
