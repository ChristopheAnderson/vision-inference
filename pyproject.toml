[project]
name = "vision-inference-hub"
version = "2.4.0"
description = "Plateforme Industrielle d'Analyse Vidéo VLM & d'Optimisation d'Inférence GPU (vLLM / AWQ / FFmpeg NVDEC)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[tool.vercel]
entrypoint = "app:app"

[tool.pyrefly]
search-path = ["src", "."]
replace-imports-with-any = [
    "fastapi",
    "fastapi.*",
    "uvicorn",
    "streamlit",
    "pandas",
    "numpy",
    "PIL",
    "PIL.*",
    "plotly",
    "plotly.*",
]
